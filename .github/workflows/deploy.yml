# Builds the site and publishes it to Cloudflare on every push to main.
# Needs one repository secret, CLOUDFLARE_API_TOKEN (see docs/deploy-cloudflare.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Build and deploy
        # wrangler.jsonc runs the production build before uploading.
        run: apps/web/node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
