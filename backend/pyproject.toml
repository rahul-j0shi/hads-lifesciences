[project]
name = "hads-backend"
version = "0.1.0"
description = "HADS Lifesciences prototype API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
